<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora - Acceso</title>
<link rel="stylesheet" href="/style.css?v=3">
<style>
  .login-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .login-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 360px;
    box-shadow: var(--shadow-lg);
  }
  .login-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, var(--accent), #1d4ed8);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.2rem;
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
  }
  .login-title {
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: .3rem;
  }
  .login-sub {
    text-align: center;
    font-size: .78rem;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
  }
  .login-error {
    color: var(--danger);
    font-size: .8rem;
    text-align: center;
    display: none;
    margin-bottom: 1rem;
    padding: .5rem;
    background: rgba(239,68,68,.1);
    border-radius: var(--radius-sm);
  }
  .login-btn {
    width: 100%;
    margin-top: 1rem;
    padding: .75rem;
  }
  .login-footer {
    text-align: center;
    margin-top: 1.5rem;
    font-size: .7rem;
    color: var(--text-muted);
  }
  .login-toggle {
    text-align: center;
    margin-top: .8rem;
    font-size: .75rem;
    color: var(--text-muted);
    cursor: pointer;
    text-decoration: underline;
  }
  .login-toggle:hover { color: var(--accent); }
  #pinSection, #userSection { display: none; }
</style>
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="login-icon">B</div>
    <div class="login-title">Bitácora</div>
    <div class="login-sub" id="loginSub">Ingresá tus credenciales</div>
    <div class="login-error" id="loginError">Credenciales incorrectas</div>
    <div id="userSection">
      <input class="form-input" id="usernameInput" placeholder="Usuario" style="width:100%;margin-bottom:.5rem;" autocomplete="username">
      <input class="form-input" id="passwordInput" type="password" placeholder="Contraseña" style="width:100%;" autocomplete="current-password">
    </div>
    <div id="pinSection">
      <input class="form-input login-input" id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="• • • •">
    </div>
    <button class="btn btn-primary login-btn" id="loginBtn" onclick="doLogin()">Entrar</button>
    <div class="login-toggle" id="toggleLink" onclick="toggleMode()"></div>
    <div class="login-footer">Sistema de Gestión Escolar</div>
  </div>
</div>
<script>
let mode = 'user';

async function init() {
  try {
    const r = await fetch('/api/login/config');
    const d = await r.json();
    if (d.hasCredentials) {
      mode = 'user';
      document.getElementById('userSection').style.display = 'block';
      document.getElementById('pinSection').style.display = 'none';
      document.getElementById('loginSub').textContent = 'Ingresá con usuario y contraseña';
      document.getElementById('toggleLink').textContent = 'Usar PIN';
      document.getElementById('usernameInput').focus();
    } else {
      mode = 'pin';
      document.getElementById('userSection').style.display = 'none';
      document.getElementById('pinSection').style.display = 'block';
      document.getElementById('loginSub').textContent = 'Ingresá el PIN de Subdirector';
      document.getElementById('toggleLink').textContent = '';
      document.getElementById('pinInput').focus();
    }
  } catch(e) {
    mode = 'pin';
    document.getElementById('pinSection').style.display = 'block';
    document.getElementById('userSection').style.display = 'none';
    document.getElementById('pinInput').focus();
  }
}

function toggleMode() {
  if (mode === 'user') {
    mode = 'pin';
    document.getElementById('userSection').style.display = 'none';
    document.getElementById('pinSection').style.display = 'block';
    document.getElementById('loginSub').textContent = 'Ingresá el PIN de Subdirector';
    document.getElementById('toggleLink').textContent = 'Usar usuario';
    document.getElementById('pinInput').focus();
  } else {
    mode = 'user';
    document.getElementById('userSection').style.display = 'block';
    document.getElementById('pinSection').style.display = 'none';
    document.getElementById('loginSub').textContent = 'Ingresá con usuario y contraseña';
    document.getElementById('toggleLink').textContent = 'Usar PIN';
    document.getElementById('usernameInput').focus();
  }
}

async function doLogin() {
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.style.display = 'none';

  let body;
  if (mode === 'user') {
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    if (!username || !password) { err.textContent = 'Completá todos los campos'; err.style.display = 'block'; return; }
    body = { username, password };
  } else {
    const pin = document.getElementById('pinInput').value;
    if (!pin) return;
    body = { pin };
  }

  btn.disabled = true;
  btn.textContent = 'Ingresando...';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.ok) {
      localStorage.setItem('sessionToken', d.token);
      window.location.href = '/';
    } else {
      err.textContent = 'Credenciales incorrectas';
      err.style.display = 'block';
    }
  } catch(e) {
    err.textContent = 'Error de conexión';
    err.style.display = 'block';
  }
  btn.disabled = false;
  btn.textContent = 'Entrar';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const btn = document.getElementById('loginBtn');
    if (!btn.disabled) doLogin();
  }
});
init();
</script>
</body>
</html>
